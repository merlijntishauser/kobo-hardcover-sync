name: Something does not work
description: A sync that fails, a wrong status on Hardcover, a problem with the collection or the page.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time. A few things first:

        - **Do not attach your Kobo's database** (`KoboReader.sqlite`). It holds your Kobo account's login tokens and your whole library.
        - **Do not paste a token.** The hash that `status` prints is fine.
        - A security problem does not belong here: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: The message you saw, word for word, helps most.
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Output of `kobo-hardcover-sync status`
      description: It names the mode, the Kobo's model and software, and the last message. On a server without the tool, say so.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version of the tool
      description: "`kobo-hardcover-sync --version`"
    validations:
      required: true
  - type: input
    id: kobo
    attributes:
      label: Kobo model and software version
      description: On the Kobo, More, Settings, Device information. For example "Clara Colour, 6.0.274403".
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Computer
      description: For example "macOS 27.0" or "Ubuntu 24.04, GNOME".
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: How do you run it?
      options:
        - On my own computer (local mode)
        - With a server (server mode)
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: The last lines of agent.log, if there are any
      description: "In the tool's folder: ~/Library/Application Support/kobo-hardcover-sync/ on a Mac, ~/.local/share/kobo-hardcover-sync/ on Linux. Book titles may be in it; take out what you do not want to share."
      render: text
