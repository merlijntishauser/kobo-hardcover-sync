name: image
# The container image for a household's own server:
# ghcr.io/<owner>/kobo-hardcover-sync, for amd64 and arm64, built from the
# Dockerfile as it is at a release tag. The release workflow calls this once
# the release is out; it can also be run by hand for a tag that exists.
# Nothing secret is stored: the registry takes this workflow's own token.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build, for example v0.4.0
        required: true

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: The tag is a release, and is it the newest
        id: v
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          grep -qx "version = \"$version\"" pyproject.toml || { echo "::error::$TAG is not the tag of the version in pyproject.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # "latest" follows the newest release, also when an older one is built again.
          newest="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          echo "latest=$([ "$newest" = "$TAG" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.latest == 'true' && format('ghcr.io/{0}:latest', github.repository) || '' }}
          labels: |
            org.opencontainers.image.title=kobo-hardcover-sync
            org.opencontainers.image.description=Reading progress from a stock Kobo e-reader to Hardcover: the server for a household
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.licenses=MIT
