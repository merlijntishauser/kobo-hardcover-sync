name: macos-app
# The Mac app for a release (docs/macos-app.md), added to that release as
# a disk image. Started by release.yml, from the tag; by hand only to try
# again, from the tag ("Use workflow from": the tag) with the same tag as
# input.
#
# Two jobs, so that the signing certificate is never where outside code
# runs. "build" installs the packages and builds the app, and has no
# secrets. "sign" runs in the macos-signing environment, which needs the
# maintainer's approval for each run and only lets tags v* in: it runs
# Apple's tools and this repository's scripts on what "build" made, with
# the certificate in a keychain made for this run and deleted after it.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release's tag, e.g. v0.11.0"
        type: string
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag }}

jobs:
  build:
    runs-on: macos-26 # AppIcon.icon is compiled with Xcode 26 (build.sh)
    steps:
      - name: The tag is a version
        run: echo "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+'
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: astral-sh/setup-uv@v10.2.0
      - run: command -v zstd || brew install zstd
      - run: uv build --wheel --out-dir "$RUNNER_TEMP/dist"
      - run: packaging/macos/build.sh "$RUNNER_TEMP"/dist/*.whl build/macos
      - name: Kept as an archive, so that links and permissions survive
        run: ditto -c -k --keepParent "build/macos/Kobo Hardcover Sync.app" app.zip
      - uses: actions/upload-artifact@v7
        with:
          name: macos-app
          path: app.zip
          retention-days: 1

  sign:
    needs: build
    runs-on: macos-15
    environment: macos-signing
    permissions:
      contents: write # the disk image goes on the release
    steps:
      # Pinned by commit here, where the certificate is: v7.0.1 and v8.0.2.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: macos-app
      - name: A keychain for this run, with the certificate in it
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          # An empty secret otherwise surfaces as a vague error from security import.
          for pair in CERTIFICATE:DEVELOPER_ID_P12 CERTIFICATE_PASSWORD:DEVELOPER_ID_P12_PASSWORD; do
            var=${pair%%:*}
            test -n "${!var}" || { echo "::error::${pair#*:} is empty: not set in the macos-signing environment, or not passed to this workflow"; exit 1; }
          done
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          (umask 077 && printf '%s' "$CERTIFICATE" | base64 --decode >"$RUNNER_TEMP/certificate.p12")
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign >/dev/null
          rm -f "$RUNNER_TEMP/certificate.p12"
          # A new keychain has none of Apple's intermediates: without them the
          # identity is "invalid", and find-identity -v leaves it out.
          for ca in DeveloperIDG2CA AppleWWDRCAG3 AppleWWDRCAG6; do
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/$ca.cer" "https://www.apple.com/certificateauthority/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$keychain" >/dev/null 2>&1 || true  # already known is fine
            rm -f "$RUNNER_TEMP/$ca.cer"
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -nE 's/.*"(Developer ID Application: [^"]+)".*/\1/p' | head -n 1)
          test -n "$identity" || {
            echo "::error::no valid Developer ID Application identity in DEVELOPER_ID_P12 (not Apple Development or Distribution; with its private key)"
            security find-identity -p codesigning "$keychain" | sed -n 's/^ *[0-9]*) [0-9A-F]* //p'
            exit 1
          }
          echo "IDENTITY=$identity" >>"$GITHUB_ENV"
          echo "KEYCHAIN=$keychain" >>"$GITHUB_ENV"
      - name: Signed, notarised, on a disk image
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          for pair in NOTARY_KEY_P8:NOTARY_KEY_P8 NOTARY_KEY_ID:NOTARY_KEY_ID NOTARY_ISSUER:NOTARY_ISSUER_ID; do
            var=${pair%%:*}
            test -n "${!var}" || { echo "::error::${pair#*:} is empty: not set in the macos-signing environment, or not passed to this workflow"; exit 1; }
          done
          mkdir -p build/macos
          ditto -x -k app.zip build/macos
          (umask 077 && printf '%s' "$NOTARY_KEY_P8" | base64 --decode >"$RUNNER_TEMP/notary.p8")
          packaging/macos/sign.sh "$IDENTITY" "build/macos/Kobo Hardcover Sync.app"
          NOTARY_KEY="$RUNNER_TEMP/notary.p8" packaging/macos/package.sh \
            "$IDENTITY" "build/macos/Kobo Hardcover Sync.app" "Kobo-Hardcover-Sync-${TAG#v}.dmg"
      - name: The keychain and the key go
        if: always()
        run: |
          [ -z "${KEYCHAIN:-}" ] || security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/certificate.p12"
      # After the keychain is gone: the first run under the hardened runtime.
      - name: Signed, the tool in it answers
        run: |
          app="$PWD/build/macos/Kobo Hardcover Sync.app"
          py="$app/Contents/Resources/python/bin/python3"
          "$py" -I -B -m kobo_hardcover_sync --version
          KHS_HOME="$RUNNER_TEMP/khs" KHS_APP="$app" "$py" -I -B -m kobo_hardcover_sync status
          "$py" -I -B -c "import cryptography.fernet as f; f.Fernet(f.Fernet.generate_key()).encrypt(b'x')"
          codesign --display --verbose=2 "$app" 2>&1 | grep -E "^(Authority|TeamIdentifier|Runtime)"
      - name: On the release
        run: gh release upload "$TAG" "Kobo-Hardcover-Sync-${TAG#v}.dmg" --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
